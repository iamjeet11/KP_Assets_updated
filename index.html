<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KP Group · Infrastructure Story (Embed)</title>

<style>
  :root {
    --bg-0: #04060d;
    --bg-1: #070b18;
    --bg-2: #0b1224;
    --panel: rgba(10, 18, 36, 0.78);
    --panel-stroke: rgba(94, 234, 212, 0.18);
    --grid: rgba(94, 234, 212, 0.06);
    --text: #e6f1ff;
    --muted: #7b8aa8;
    --cyan: #5eead4;
    --cyan-soft: #22d3ee;
    --orange: #fb923c;
    --orange-soft: #fbbf24;
    --purple: #a78bfa;
    --green: #4ade80;
    --pink: #f472b6;
    --red: #f87171;
    --yellow: #fde047;
  }
html,
body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#04060d !important;
}

body{
    will-change:transform;
    backface-visibility:hidden;
    transform:translateZ(0);
}

.app{
    animation:fadeIn 0.35s ease-out;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:scale(1.01);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}
body:before{
    content:'';
    position:fixed;
    inset:0;
    background:#04060d;
    z-index:9999;
    pointer-events:none;
    animation:overlayFade .45s ease forwards;
}

@keyframes overlayFade{
    from{
        opacity:1;
    }

    to{
        opacity:0;
    }
}
  * { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    margin:0;
    padding:0;
    overflow:hidden;
    width:100%;
    height:100%;
}
  body {
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(94, 234, 212, 0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(251, 146, 60, 0.08), transparent 60%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(94, 234, 212, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94, 234, 212, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 100% 80% at 50% 50%, #000 30%, transparent 80%);
    pointer-events: none; z-index: 0;
  }

.app {
    position: relative;
    z-index: 1;
    width:100vw;
    height:100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr;
    padding: 40px 52px;
    gap: 0;
  }

  /* ===================== STAGE ===================== */
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    border: 1px solid var(--panel-stroke);
    background:
      radial-gradient(ellipse 90% 60% at 50% 60%, #0a1428 0%, #050912 70%, #04060d 100%);
    overflow: hidden;
  }
  .stage::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(94, 234, 212, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94, 234, 212, 0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }
  .corner { position: absolute; width: 20px; height: 20px; border: 1px solid var(--cyan); opacity: 0.6; }
  .corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
  .corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

  .stage-title {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 5;
  }
  .stage-title .eyebrow { font-family: 'Segoe UI', sans-serif;
font-weight: 700; font-size: 22px; font-weight: 600; color: var(--cyan); letter-spacing: 0.40em; opacity: 0.7; }
  .stage-title .title { font-family: 'Segoe UI', sans-serif;
font-weight: 700; font-size: 54px; font-weight: 800; color: var(--text); letter-spacing: 0.12em; margin-top: 3px; text-shadow: 0 0 24px rgba(94, 234, 212, 0.30); transition: color 0.5s; }

  .scene-wrap { position: absolute; inset: 0; }
  .scene { width: 100%; height: 100%; display: block; }

  /* Legend (always visible, shows what's what in the scene) */
  .legend {
    position: absolute;
    bottom: 14px; left: 18px;
    display: flex; gap: 12px;
    padding: 18px 24px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-stroke);
    z-index: 7;
    font-family: 'Segoe UI', sans-serif;
    font-size: 22px;
    gap: 28px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend-dot.orange { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
  .legend-dot.cyan { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .legend-dot.purple { background: var(--purple); box-shadow: 0 0 6px var(--purple); }
  .legend-dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .legend-dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .legend-dot.pink { background: var(--pink); box-shadow: 0 0 6px var(--pink); }

  /* ===================== ANIMATIONS ===================== */
  .turbine-blade { transform-origin: center; animation: spin 4s linear infinite; }
  .turbine-blade.fast { animation-duration: 2.5s; }
  .turbine-blade.slow { animation-duration: 5s; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .flow-line { stroke-dasharray: 4 10; animation: flow 1.6s linear infinite; }
  .flow-line.slow { animation-duration: 2.4s; }
  .flow-line.reverse { animation-direction: reverse; }
  @keyframes flow { to { stroke-dashoffset: -28; } }

  .panel-glint { animation: glint 4s ease-in-out infinite; }
  @keyframes glint { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } }

  .focus-glow { transition: opacity 0.8s ease; }

  .callout { cursor: pointer; transition: filter 0.4s; }
  .callout-circle-bg { transition: r 0.4s ease, fill-opacity 0.4s ease; }
  .callout-halo { opacity: 0; transition: opacity 0.4s ease; }
  .callout.active .callout-halo { opacity: 1; animation: haloPulse 2s ease-in-out infinite; }
  .callout.active .callout-circle-bg { fill-opacity: 1; }
  .callout-num { font-family: 'Segoe UI', sans-serif;
font-weight: 700; font-weight: 800; pointer-events: none; }
  .callout-leader { transition: stroke-width 0.4s, opacity 0.4s; }
  .callout.active .callout-leader { stroke-width: 1.8; opacity: 1; }
  @keyframes haloPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.15); }
  }
  .callout-halo { transform-box: fill-box; transform-origin: center; }

  .asset-glow { opacity: 0; transition: opacity 0.6s ease; }
  .asset-glow.active { opacity: 1; }

  /* Floating tooltip badges */
.tip {
    position: absolute;

    display: flex;
    align-items: center;
    justify-content: center;

    line-height: 1;

    background: rgba(4, 6, 13, 0.96);
    backdrop-filter: blur(18px);

    border: 2.4px solid rgba(94, 234, 212, 0.34);
    border-radius: 18px;

    padding: 20px 38px;

    font-family: 'Segoe UI', sans-serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;

    color: var(--text);

    pointer-events: none;
    z-index: 6;
    white-space: nowrap;

    transition:
      opacity 0.3s,
      transform 0.3s,
      border-color 0.3s,
      box-shadow 0.3s;

    opacity: 0.98;

    box-shadow:
      0 0 18px rgba(94, 234, 212, 0.16),
      0 0 48px rgba(94, 234, 212, 0.10);
}

.tip b {
    font-family: 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 34px;

    margin-right: 18px;
    min-width: 185px;

    display: inline-block;
    text-align: left;
}

.tip.active {
    opacity: 1;
    transform: scale(1.06);

    box-shadow:
      0 0 30px rgba(94, 234, 212, 0.22),
      0 0 78px rgba(94, 234, 212, 0.16);
}
.tip.orange{
    border-color: var(--orange);

    box-shadow:
      0 0 24px rgba(251,146,60,0.22),
      0 0 64px rgba(251,146,60,0.14);
}
.pss-tip b{
    min-width: 70px;
    margin-right: 14px;
}
.locations-tip b{
    min-width: 75px;
    margin-right: 14px;
}
.tip.cyan{
    border-color: var(--cyan);

    box-shadow:
      0 0 24px rgba(94,234,212,0.22),
      0 0 64px rgba(94,234,212,0.14);
}
.modules-tip b{
    min-width: 118px;
    margin-right: 16px;
}
.acres-tip b{
    min-width: 128px;
    margin-right: 16px;
}
.strings-tip b{
    min-width: 150px;
    margin-right: 16px;
}
.clients-tip b{
    min-width: 82px;
    margin-right: 14px;
}
.tip.purple{
    border-color: var(--purple);

    box-shadow:
      0 0 24px rgba(167,139,250,0.22),
      0 0 64px rgba(167,139,250,0.14);
}

.gss-tip b{
    min-width: 68px;

}
.transformers-tip b{

    margin-right: 14px;
}
.inverters-tip b{
    min-width: 118px;

}
.wtgs-tip b{
    min-width: 95px;

}
.tip.green{
    border-color: var(--green);

    box-shadow:
      0 0 24px rgba(74,222,128,0.22),
      0 0 64px rgba(74,222,128,0.14);
}

.tip.yellow{
    border-color: var(--yellow);

    box-shadow:
      0 0 24px rgba(253,224,71,0.22),
      0 0 64px rgba(253,224,71,0.14);
}

.transmission-box{
    min-width: 520px;
}

.evac-box{
    min-width: 550px;
}
.tip.pink{
    border-color: var(--pink);

    box-shadow:
      0 0 24px rgba(244,114,182,0.22),
      0 0 64px rgba(244,114,182,0.14);
}
  .tip.active { opacity: 1; transform: scale(1.05); box-shadow: 0 0 18px rgba(94, 234, 212, 0.20); }

  @media (max-width: 1280px) {
    .tickers { gap: 10px; } .ticker { padding: 3px 9px; } .ticker-value { font-size: 11px; }
  }
</style>
</head>

<script>
const DATA = {
  chapters: [
    {
      id: 'solar', color: 'orange', title: 'SOLAR GENERATION',
      tag: 'Photovoltaic Asset Layer',
      focus: [{ cx: 280, cy: 600, rx: 340, ry: 170, grad: 'focusOrange' }],
      tipColor: 'orange',
      activeTips: [0, 1, 2],
      stageTitle: 'PHOTOVOLTAIC GENERATION — MODULES, STRINGS, INVERTERS',
      metrics: [
        { label: 'Modules',   value: '', suffix: 'Units',  cls: 'orange', icon: 'panel' },
        { label: 'Strings',   value: '', suffix: 'Series', cls: 'orange', icon: 'string' },
        { label: 'Inverters', value: '', suffix: 'Units',  cls: 'orange', icon: 'inverter' },
      ],
      desc: 'PV modules wired into strings feed inverters that convert DC sunlight to AC, then step up through pad transformers into the collector network.'
    },
    {
      id: 'wind', color: 'cyan', title: 'WIND POWER',
      tag: 'Onshore Wind Turbine Fleet',
      focus: [{ cx: 250, cy: 440, rx: 290, ry: 130, grad: 'focusCyan' }],
      tipColor: 'cyan',
      activeTips: ['cyan'],
      stageTitle: 'WIND ENERGY GENERATION — TURBINES ACROSS RIDGES',
      metrics: [
        { label: 'Wind Turbines', value: '', suffix: 'WTGs', cls: 'cyan', icon: 'wind' },
      ],
      desc: 'Wind turbine generators harvest kinetic energy across ridge sites, feeding a collector substation that pushes power to the PSS via dedicated HT lattice towers.'
    },
    {
      id: 'transformer', color: 'purple', title: 'STEP-UP TRANSFORMERS',
      tag: 'Conversion Assets · Spread Across the Network',
      focus: [
        { cx: 630, cy: 660, rx: 90, ry: 60, grad: 'focusPurple' },
        { cx: 455, cy: 405, rx: 80, ry: 55, grad: 'focusPurple' },
        { cx: 825, cy: 480, rx: 140, ry: 80, grad: 'focusPurple' },
        { cx: 1430, cy: 440, rx: 100, ry: 65, grad: 'focusPurple' },
      ],
      stageTitle: 'STEP-UP TRANSFORMERS — DISTRIBUTED ACROSS THE NETWORK',
      metrics: [
        { label: 'Transformers', value: '', suffix: 'Units', cls: 'purple', icon: 'tx' },
        { label: 'Locations',    value: '', suffix: 'Sites', cls: 'purple', icon: 'map' },
      ],
      desc: 'Step-up transformers raise generation voltage for transmission — installed at solar farms, wind collector stations, every PSS, and the GSS. Together they span operational locations under unified O&M.'
    },
    {
      id: 'pss', color: 'green', title: 'POOLING SUBSTATIONS',
      tag: 'KP-Owned Aggregation Yards',
      focus: [{ cx: 830, cy: 490, rx: 220, ry: 120, grad: 'focusGreen' }],
      stageTitle: 'PRIVATE POOLING SUBSTATIONS — POWER AGGREGATION',
      metrics: [
        { label: 'Pooling Substations', value: '', suffix: 'PSS', cls: 'green', icon: 'pss' },
      ],
      desc: 'Power generated across sites is aggregated at KP-owned Pooling Substations. Each PSS houses step-up transformers, bus bars, dead-end gantries, and a control building before handing off to the grid.'
    },
    {
      id: 'grid', color: 'yellow', title: 'GRID TRANSMISSION',
      tag: 'HT Network · GSS Interconnection',
      focus: [{ cx: 1170, cy: 480, rx: 360, ry: 140, grad: 'focusYellow' }],
      stageTitle: 'TRANSMISSION CORRIDOR — KM TO GRID SUBSTATIONS',
      metrics: [
        { label: 'Grid Substations',    value: '', suffix: 'GSS', cls: 'yellow', icon: 'gss' },
        { label: 'Evacuation Capacity', value: '', suffix: 'MW',  cls: 'yellow', icon: 'bolt' },
        { label: 'Transmission Lines',  value: '', suffix: 'KM',  cls: 'yellow', icon: 'tx-line' },
      ],
      desc: 'Power flows through km of self-built high-tension lines on lattice towers, terminating at Government Grid Substations with a combined evacuation capacity in MW.'
    },
    {
      id: 'client', color: 'pink', title: 'LAND BANK & CLIENTS',
      tag: 'Portfolio Footprint & Offtake',
      focus: [{ cx: 1400, cy: 640, rx: 280, ry: 140, grad: 'focusPink' }],
      stageTitle: 'PORTFOLIO FOOTPRINT — ACRES, CLIENTS',
      metrics: [
        { label: 'Land Bank', value: '', suffix: 'Acres',     cls: 'pink', icon: 'land' },
        { label: 'Clients',   value: '', suffix: 'Offtakers', cls: 'pink', icon: 'client' },
      ],
      desc: 'A strategic land bank underpins current generation and supports future expansion, while commercial and industrial clients draw clean power from the grid.'
    },
  ],
  chapterDuration: 15,
};

const state = { activeChapter: 0, playing: true, elapsed: 0, lastTick: null };

const els = {
  stageTitle: document.getElementById('stage-title'),
  chapters: [...document.querySelectorAll('.chapter-btn')],
  btnPlay: document.getElementById('btn-play'),
  btnPrev: document.getElementById('btn-prev'),
  btnNext: document.getElementById('btn-next'),
  iconPlay: document.getElementById('icon-play'),
  iconPause: document.getElementById('icon-pause'),
  timeCurrent: document.getElementById('time-current'),
  clockTime: document.getElementById('clock-time'),
  callouts: [...document.querySelectorAll('.callout')],
  tips: [...document.querySelectorAll('.tip')],
  focusGlow: document.getElementById('focus-glow'),
  focusGlow2: document.getElementById('focus-glow-2'),
  focusGlow3: document.getElementById('focus-glow-3'),
};

(function injectExtraGlow() {
  const group = document.getElementById('focus-glow-group');
  const g4 = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
  g4.setAttribute('id', 'focus-glow-4');
  g4.setAttribute('class', 'focus-glow');
  g4.setAttribute('cx', '0'); g4.setAttribute('cy', '0');
  g4.setAttribute('rx', '80'); g4.setAttribute('ry', '50');
  g4.setAttribute('fill', 'url(#focusPurple)');
  g4.setAttribute('opacity', '0');
  group.appendChild(g4);
  els.focusGlow4 = g4;
})();

function applyFocus(chapter) {
  const spots = chapter.focus;
  const allGlows = [els.focusGlow, els.focusGlow2, els.focusGlow3, els.focusGlow4];
  allGlows.forEach(g => { g.setAttribute('opacity', '0'); });
  if (spots[0]) {
    els.focusGlow.setAttribute('cx', spots[0].cx);
    els.focusGlow.setAttribute('cy', spots[0].cy);
    els.focusGlow.setAttribute('rx', spots[0].rx);
    els.focusGlow.setAttribute('ry', spots[0].ry);
    els.focusGlow.setAttribute('fill', `url(#${spots[0].grad})`);
    els.focusGlow.setAttribute('opacity', '1');
  }
  for (let i = 1; i < spots.length && i < 4; i++) {
    const g = allGlows[i];
    g.setAttribute('cx', spots[i].cx);
    g.setAttribute('cy', spots[i].cy);
    g.setAttribute('rx', spots[i].rx);
    g.setAttribute('ry', spots[i].ry);
    g.setAttribute('fill', `url(#${spots[i].grad})`);
    g.setAttribute('opacity', '1');
  }
}

function renderChapter(idx) {
  const ch = DATA.chapters[idx];
  if (!ch) return;
  state.activeChapter = idx;
  state.elapsed = 0;

  els.stageTitle.textContent = ch.stageTitle;
  applyFocus(ch);

  els.callouts.forEach((c, i) => c.classList.toggle('active', i === idx));
  els.tips.forEach(t => t.classList.toggle('active', t.classList.contains(ch.color)));

  els.chapters.forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
    btn.classList.toggle('done', i < idx);
  });
}

function ensureBarFills() {
  els.chapters.forEach(btn => {
    const bar = btn.querySelector('.chapter-bar');
    if (!bar) return;
    if (!bar.querySelector('.bar-fill')) {
      const fill = document.createElement('span');
      fill.className = 'bar-fill';
      Object.assign(fill.style, {
        position: 'absolute', left: '0', top: '0', bottom: '0', width: '0%',
        background: 'var(--cyan)', boxShadow: '0 0 10px var(--cyan)',
        transition: 'width 0.1s linear'
      });
      bar.style.position = 'relative';
      bar.appendChild(fill);
    }
  });
}

function colorFor(color) {
  return {
    orange: 'var(--orange)', cyan: 'var(--cyan)', purple: 'var(--purple)',
    green: 'var(--green)', yellow: 'var(--yellow)', pink: 'var(--pink)'
  }[color] || 'var(--cyan)';
}

function updateProgressBars() {
  els.chapters.forEach((btn, i) => {
    const fill = btn.querySelector('.bar-fill');
    if (!fill) return;
    const c = colorFor(btn.dataset.color);
    fill.style.background = c;
    fill.style.boxShadow = `0 0 10px ${c}`;
    if (i < state.activeChapter) fill.style.width = '100%';
    else if (i === state.activeChapter) {
      const pct = Math.min(100, (state.elapsed / (DATA.chapterDuration * 1000)) * 100);
      fill.style.width = `${pct}%`;
    } else fill.style.width = '0%';
  });
}

function tick(ts) {
  if (!state.lastTick) state.lastTick = ts;
  const dt = ts - state.lastTick;
  state.lastTick = ts;
  if (state.playing) {
    state.elapsed += dt;
    if (state.elapsed >= DATA.chapterDuration * 1000) {
      const next = (state.activeChapter + 1) % DATA.chapters.length;
      renderChapter(next);
    }
    updateProgressBars();
    if (els.timeCurrent) {
      const totalMs = state.activeChapter * DATA.chapterDuration * 1000 + state.elapsed;
      const totalSec = Math.floor(totalMs / 1000);
      els.timeCurrent.textContent = `${Math.floor(totalSec/60)}:${String(totalSec%60).padStart(2,'0')}`;
    }
  }
  requestAnimationFrame(tick);
}

function setPlaying(playing) {
  state.playing = playing;
  if (els.iconPlay)  els.iconPlay.style.display  = playing ? 'none' : 'block';
  if (els.iconPause) els.iconPause.style.display = playing ? 'block' : 'none';
}

els.chapters.forEach((btn, i) => btn.addEventListener('click', () => renderChapter(i)));
els.btnPlay?.addEventListener('click', () => setPlaying(!state.playing));
els.btnPrev?.addEventListener('click', () => {
  const prev = (state.activeChapter - 1 + DATA.chapters.length) % DATA.chapters.length;
  renderChapter(prev);
});
els.btnNext?.addEventListener('click', () => {
  const next = (state.activeChapter + 1) % DATA.chapters.length;
  renderChapter(next);
});
els.callouts.forEach((c, i) => {
  c.addEventListener('click', () => {
    renderChapter(i);
    setPlaying(false);
  });
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!state.playing); }
  else if (e.code === 'ArrowRight') {
    const next = (state.activeChapter + 1) % DATA.chapters.length;
    renderChapter(next);
  }
  else if (e.code === 'ArrowLeft') {
    const prev = (state.activeChapter - 1 + DATA.chapters.length) % DATA.chapters.length;
    renderChapter(prev);
  }
});

function startClock() {
  if (!els.clockTime) return;
  const update = () => {
    const d = new Date();
    els.clockTime.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  };
  update(); setInterval(update, 1000);
}

ensureBarFills();
renderChapter(0);
setPlaying(true);
startClock();
requestAnimationFrame(tick);
</script>
